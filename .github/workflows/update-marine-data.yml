name: Update Marine Data and Deploy Website

on:
  workflow_dispatch:

  schedule:
    - cron: "17 * * * *"

  push:
    branches:
      - main


permissions:
  contents: write
  pages: write
  id-token: write


concurrency:
  group: "pages"
  cancel-in-progress: false


jobs:

  update-data:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"


      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests beautifulsoup4


      - name: Update marine observations
        run: |
          python scripts/update_marine.py


      - name: Check generated data
        run: |
          echo "Checking data/marine.json..."

          test -f data/marine.json

          python - <<'PY'
          import json

          with open("data/marine.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          print("marine.json loaded successfully.")

          if "stations" not in data:
              raise SystemExit(
                  "ERROR: 'stations' is missing from marine.json"
              )

          print("Stations found:")

          for station_id, station in data["stations"].items():
              print(
                  f"  {station_id}: "
                  f"{station.get('name', 'Unknown')}"
              )
          PY


      - name: Commit updated marine data
        run: |

          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/marine.json

          if git diff --cached --quiet; then

            echo "No marine data changes to commit."

          else

            git commit -m "Update marine observations"

            git push

          fi


  deploy:

    runs-on: ubuntu-latest

    needs:
      - update-data

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5


      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."


      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
