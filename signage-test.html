<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Signagelive Test</title>

<style>

html,
body {

    margin: 0;

    padding: 0;

    width: 100%;

    height: 100%;

    overflow: hidden;

    background: #000;

    color: #fff;

    font-family: Arial, Helvetica, sans-serif;

}


#viewport {

    width: 100vw;

    height: 100vh;

    border: 15px solid #00ff00;

    padding: 40px;

    background: #101820;

}


h1 {

    margin: 0 0 35px 0;

    font-size: 60px;

    color: #00ffff;

}


.info {

    font-size: 42px;

    line-height: 1.5;

    font-weight: bold;

}


.label {

    color: #ffff00;

}


.warning {

    margin-top: 40px;

    padding: 25px;

    background: #ff0000;

    color: #fff;

    font-size: 30px;

    font-weight: bold;

}

</style>

</head>


<body>

<div id="viewport">

    <h1>
        SIGNAGELIVE TEST
    </h1>


    <div class="info">

        <div>
            <span class="label">
                VIEWPORT:
            </span>

            <span id="viewport-size">
                loading...
            </span>
        </div>


        <div>
            <span class="label">
                SCREEN:
            </span>

            <span id="screen-size">
                loading...
            </span>
        </div>


        <div>
            <span class="label">
                DEVICE PIXEL RATIO:
            </span>

            <span id="pixel-ratio">
                loading...
            </span>
        </div>


        <div>
            <span class="label">
                WINDOW:
            </span>

            <span id="window-size">
                loading...
            </span>
        </div>

    </div>


    <div class="warning">

        If you can see this entire green-bordered
        area, the browser viewport is fitting correctly.

    </div>

</div>


<script>

function updateInformation() {

    document.getElementById(
        "viewport-size"
    ).textContent =
        window.innerWidth
        + " × "
        + window.innerHeight
        + " px";


    document.getElementById(
        "screen-size"
    ).textContent =
        screen.width
        + " × "
        + screen.height
        + " px";


    document.getElementById(
        "pixel-ratio"
    ).textContent =
        window.devicePixelRatio;


    document.getElementById(
        "window-size"
    ).textContent =
        window.outerWidth
        + " × "
        + window.outerHeight
        + " px";

}


updateInformation();


window.addEventListener(
    "resize",
    updateInformation
);

</script>

</body>

</html>
