name: Update UK Marine Data

on:

  workflow_dispatch:

  schedule:

    # Met Office marine observations are updated
    # approximately hourly, around 15 minutes past
    # the hour.
    #
    # Run this job at 20 minutes past each hour.

    - cron: "20 * * * *"


permissions:
  contents: write


concurrency:

  group: marine-data-update

  cancel-in-progress: true


jobs:

  update:

    runs-on: ubuntu-latest

    steps:

      # ------------------------------------------------------
      # Checkout repository
      # ------------------------------------------------------

      - name: Checkout repository

        uses: actions/checkout@v4


      # ------------------------------------------------------
      # Python
      # ------------------------------------------------------

      - name: Set up Python

        uses: actions/setup-python@v5

        with:
          python-version: "3.12"


      # ------------------------------------------------------
      # Python packages
      #
      # NO AWS CLI
      # NO apt-get
      # NO AWS credentials
      # ------------------------------------------------------

      - name: Install Python dependencies

        run: |

          python -m pip install --upgrade pip

          python -m pip install \
            requests \
            beautifulsoup4


      # ------------------------------------------------------
      # Update observations
      # ------------------------------------------------------

      - name: Download Met Office observations

        run: |

          python scripts/update_marine.py


      # ------------------------------------------------------
      # Validate JSON
      # ------------------------------------------------------

      - name: Validate JSON

        run: |

          python -m json.tool \
            data/marine.json \
            > /dev/null

          echo "JSON validation successful."


      # ------------------------------------------------------
      # Validate station configuration
      # ------------------------------------------------------

      - name: Validate requested stations

        run: |

          python3 - <<'PY'

          import json
          import sys


          expected_page1 = [
              "M5",
              "SEVEN_STONES",
              "CHANNEL",
              "SANDETTIE",
          ]


          expected_page2 = [
              "DONNA_NOOK",
              "BOULMER",
              "LERWICK",
              "K7",
          ]


          with open(
              "data/marine.json",
              "r",
              encoding="utf-8",
          ) as file:

              data = json.load(file)


          actual_page1 = data[
              "pages"
          ][
              "page1"
          ]


          actual_page2 = data[
              "pages"
          ][
              "page2"
          ]


          if actual_page1 != expected_page1:

              print(
                  "ERROR: Page 1 is incorrect."
              )

              print(
                  "Expected:",
                  expected_page1,
              )

              print(
                  "Found:",
                  actual_page1,
              )

              sys.exit(1)


          if actual_page2 != expected_page2:

              print(
                  "ERROR: Page 2 is incorrect."
              )

              print(
                  "Expected:",
                  expected_page2,
              )

              print(
                  "Found:",
                  actual_page2,
              )

              sys.exit(1)


          expected_stations = (
              expected_page1
              + expected_page2
          )


          for station in expected_stations:

              if station not in data[
                  "stations"
              ]:

                  print(
                      "ERROR: Missing station:",
                      station,
                  )

                  sys.exit(1)


          print(
              "All eight requested stations "
              "are present."
          )

          PY


      # ------------------------------------------------------
      # Display generated data in the Action log
      # ------------------------------------------------------

      - name: Show generated data

        run: |

          cat data/marine.json


      # ------------------------------------------------------
      # Commit changed data
      # ------------------------------------------------------

      - name: Commit updated observations

        run: |

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          git add data/marine.json


          if git diff --cached --quiet; then

            echo "No observation changes."

          else

            git commit \
              -m "Update Met Office marine observations"

            git push

          fi
