<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        http-equiv="Cache-Control"
        content="no-cache, no-store, must-revalidate"
    >

    <title>
        UK Marine Observations - Page 1
    </title>

    <link
        rel="stylesheet"
        href="styles.css"
    >

</head>


<body data-page="1">

    <main class="page">

        <header>

            <h1 id="page-title">
                UK MARINE OBSERVATIONS
            </h1>

            <div class="header-right">

                <div id="status-message">
                    Loading observations…
                </div>

                <div id="last-updated">
                    Loading…
                </div>

            </div>

        </header>


        <div id="station-grid">
            <!-- JavaScript inserts four stations -->
        </div>


        <footer>

            <span>
                Source: Met Office
            </span>

            <span>
                Observations are updated approximately hourly
            </span>

        </footer>

    </main>


    <script
        src="app.js"
        defer
    ></script>

</body>
</html>
