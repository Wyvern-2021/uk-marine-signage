name: Update UK Marine Data

on:

  workflow_dispatch:

  schedule:

    # Run shortly after the Met Office's
    # normal hourly publication window.

    - cron: "25 * * * *"


permissions:

  contents: write


jobs:

  update:

    runs-on: ubuntu-latest


    steps:

      - name: Checkout repository

        uses: actions/checkout@v4


      - name: Install AWS CLI

        run: |

          sudo apt-get update

          sudo apt-get install -y awscli


      - name: Download Met Office marine observations

        run: |

          rm -rf data/source

          mkdir -p data/source


          aws s3 sync \
            s3://met-office-marine-observations-data/ \
            data/source/ \
            --no-sign-request \
            --region eu-west-2 \
            --only-show-errors


      - name: Build signage data

        run: |

          python3 scripts/build_data.py


      - name: Remove raw CSV files

        run: |

          rm -rf data/source


      - name: Commit updated JSON

        run: |

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          git add data/marine.json


          if git diff --cached --quiet; then

            echo "No changes to commit."

          else

            git commit \
              -m "Update marine observations"

            git push

          fi
