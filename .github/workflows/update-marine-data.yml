name: Update UK Marine Data

on:

  workflow_dispatch:

  schedule:

    # Run at 25 minutes past every hour.
    #
    # The Met Office publishes its public
    # marine dataset hourly, normally around
    # 15 minutes past the hour.
    - cron: "25 * * * *"


permissions:

  contents: write


concurrency:

  group: marine-data-update

  cancel-in-progress: true


jobs:

  update:

    runs-on: ubuntu-latest


    steps:

      - name: Checkout repository

        uses: actions/checkout@v4


      - name: Set up Python

        uses: actions/setup-python@v5

        with:

          python-version: "3.12"


      - name: Install Python dependencies

        run: |

          python -m pip install \
            --upgrade pip

          python -m pip install \
            pandas \
            lxml


      - name: Update marine data

        run: |

          python scripts/update_marine.py


      - name: Validate JSON

        run: |

          python -m json.tool \
            data/marine.json \
            > /dev/null

          echo "JSON validation successful."


      - name: Validate station list

        run: |

          python3 - <<'PY'

          import json
          import sys

          expected_page1 = [
              "Channel",
              "Seven Stones",
              "Sandettie",
              "M5",
          ]

          expected_page2 = [
              "Donna Nook",
              "Lerwick",
              "K7",
              "Malin Head",
          ]

          with open(
              "data/marine.json",
              "r",
              encoding="utf-8"
          ) as file:

              data = json.load(file)


          if data.get("pages", {}).get(
              "page1"
          ) != expected_page1:

              print(
                  "ERROR: Page 1 station list "
                  "is incorrect."
              )

              sys.exit(1)


          if data.get("pages", {}).get(
              "page2"
          ) != expected_page2:

              print(
                  "ERROR: Page 2 station list "
                  "is incorrect."
              )

              sys.exit(1)


          stations = data.get(
              "stations",
              {}
          )


          for station in (
              expected_page1
              + expected_page2
          ):

              if station not in stations:

                  print(
                      f"ERROR: Missing station "
                      f"{station}"
                  )

                  sys.exit(1)


          print(
              "All eight stations are present."
          )

          PY


      - name: Show generated data

        run: |

          cat data/marine.json


      - name: Commit updated data

        run: |

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          git add data/marine.json


          if git diff --cached --quiet; then

            echo "No changes to commit."

          else

            git commit \
              -m "Update marine observations"

            git push

          fi
